<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>번역 결과</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #fff;
      color: #000;
    }
    a {
      color: #000;
    }
    .block {
      margin-bottom: 40px;
    }
    .back {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h2>🌍 번역 결과</h2>
  {% for i in range(urls|length) %}
    <div class="block">
      <p><a href="{{ urls[i] }}" target="_blank">{{ urls[i] }}</a></p>
      <p>{{ translated[i] }}</p>
    </div>
    <hr>
  {% endfor %}

  <div class="back">
    <a href="{{ url_for('index') }}">⬅️ 돌아가기</a>
  </div>
</body>
</html>
