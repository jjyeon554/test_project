<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>QR 코드 결과</title>
</head>
<body>
  <h2>📷 QR 코드 결과</h2>
  {% for url, qr in qrcodes %}
    <div>
      <p><a href="{{ url }}" target="_blank">{{ url }}</a></p>
      <img src="data:image/png;base64,{{ qr }}">
    </div>
    <hr>
  {% endfor %}
  <a href="{{ url_for('index') }}">⬅️ 돌아가기</a>
</body>
</html>
